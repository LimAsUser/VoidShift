<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID SHIFT V20 player art inspection</title>
<style>
body{margin:0;padding:24px;background:#07131d;color:#dbeef2;font:16px system-ui,sans-serif}h1{font-size:25px}p{color:#9cc0cd}button{padding:10px 20px;background:#173a48;border:1px solid #65ddeb;color:#def8ff;cursor:pointer}canvas{display:block;width:100%;max-width:1100px;height:auto;border:1px solid #345668;background:#112734;margin-top:20px}small{display:block;margin-top:12px;color:#9cc0cd}
</style>
<h1>VOID SHIFT · 人物与枪械检查</h1>
<p>独立素材预览：没有真实任务、背包或存档操作。</p>
<button id="motion">暂停动作</button> <button id="quality">切换箭头对照</button>
<canvas id="scene" width="1100" height="650"></canvas>
<small>第一排：六把武器；第二排：四方向；第三排：走路、倒地副武器与实际游戏缩放对照。</small>
<script src="../js/player-art.js"></script>
<script>
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),images=new Map();
const art=new PlayerArt(name=>{if(!images.has(name)){const image=new Image();image.src='../resources/images/'+name+'.png';images.set(name,image);}return images.get(name);});
const state={running:true,textureQuality:'high',missionFxId:'inspection',coop:{}},ids=Object.keys(PlayerArt.weapons);
const names=['手枪','冲锋枪','散弹枪','左轮','机关枪','小型散弹枪'];
const actors=Array.from({length:12},(_,i)=>({x:0,y:0,angle:0,weaponId:ids[i%6],moveSpeed:70}));
let paused=false,low=false,last=0;
document.getElementById('motion').onclick=()=>{paused=!paused;state.coop.hostPaused=paused;document.getElementById('motion').textContent=paused?'继续动作':'暂停动作';};
document.getElementById('quality').onclick=()=>{low=!low;state.textureQuality=low?'low':'high';};
function drawActor(actor,x,y,scale,angle,key,now){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);if(!art.draw(ctx,actor,state,key,now)){ctx.fillStyle='#75ddd0';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-9,-9);ctx.lineTo(-6,0);ctx.lineTo(-9,9);ctx.closePath();ctx.fill();}ctx.restore();}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,1100,650);ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillStyle='#bddbe5';
for(let i=0;i<6;i++){const x=90+i*182;drawActor(actors[i],x,120,2.4,0,'weapon-'+i,now);ctx.fillText(names[i],x,200);}
for(let i=0;i<4;i++){const x=140+i*270;actors[6+i].weaponId='smg';drawActor(actors[6+i],x,320,2.4,i*Math.PI/2,'turn-'+i,now);ctx.fillText(['右','下','左','上'][i],x,400);}
if(!paused)actors[10].x+=70*dt;actors[10].weaponId='shotgun';drawActor(actors[10],200,530,2.4,0,'walker',now);ctx.fillText('实际位移驱动走路',200,610);
actors[11].weaponId='pistol';actors[11].downed=true;drawActor(actors[11],570,530,2.4,0,'downed',now);ctx.fillText('倒地副武器',570,610);
drawActor(actors[0],920,530,1.56,0,'game-scale',now);ctx.fillText('游戏基础 1.56×',920,610);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</html>
